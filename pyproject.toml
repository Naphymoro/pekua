[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pekua"
version = "0.1.0"
description = "Evidence-first scholarly and patent intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "cryptography>=50,<51",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "neo4j>=5.24,<6",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
extract = ["pypdf>=6.16.1,<7", "beautifulsoup4>=4.12,<5", "lxml>=6.1,<7"]
mcp = ["mcp>=1.2,<2"]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
pekua-api = "pekua.api.app:run"
pekua-mcp = "pekua.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/pekua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pekua"]

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
