name: pekua

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "pekua.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      PEKUA_DATABASE_URL: postgresql+asyncpg://pekua:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pekua
      PEKUA_REDIS_URL: redis://redis:6379/0
      PEKUA_OBJECT_STORE_ENDPOINT: http://minio:9000
      PEKUA_OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      PEKUA_OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "pekua.worker"]
    env_file: .env
    environment:
      PEKUA_DATABASE_URL: postgresql+asyncpg://pekua:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pekua
      PEKUA_REDIS_URL: redis://redis:6379/0
      PEKUA_OBJECT_STORE_ENDPOINT: http://minio:9000
      PEKUA_OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      PEKUA_OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pekua
      POSTGRES_USER: pekua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pekua -d pekua"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["minio-data:/data"]
    ports: ["9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    volumes: ["neo4j-data:/data"]
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.3.0
    volumes:
      - ./ops/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alert-rules.yaml:/etc/prometheus/alert-rules.yaml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  neo4j-data:
  prometheus-data:
